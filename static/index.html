<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>tiny-harness</title>
<style>
  /* 极简门面：暗色终端风，贴 CLI 出身 */
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Consolas, "Courier New", monospace; background: #0d1117;
         color: #e6edf3; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; border-bottom: 1px solid #30363d; color: #58a6ff; }
  #status { color: #8b949e; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .user { color: #7ee787; }
  .assistant { color: #e6edf3; }
  .round { color: #484f58; }
  .tool_call { color: #d2a8ff; }
  .tool_result { color: #8b949e; }
  .warn, .error { color: #f0883e; }
  .think { color: #8b949e; font-style: italic; }
  #bar { display: flex; padding: 12px; border-top: 1px solid #30363d; gap: 8px; }
  input { flex: 1; background: #161b22; color: #e6edf3; border: 1px solid #30363d;
          border-radius: 6px; padding: 10px; font-family: inherit; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px;
           padding: 10px 18px; cursor: pointer; font-family: inherit; }
  .ghost { background: transparent; color: #8b949e; border: 1px solid #30363d; }
</style>
</head>
<body>
<header>tiny-harness · 自造 Agent（无框架） · <span id="status">空闲</span></header>
<div id="log"></div>
<div id="bar">
  <input id="q" placeholder="问点什么…（Enter 发送）" autofocus>
  <button class="ghost" onclick="resetChat()">新会话</button>
  <button onclick="send()">发送</button>
</div>
<script>
const log = document.getElementById("log");
const q = document.getElementById("q");
const status = document.getElementById("status");

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;   // 自动滚到底
}

function typewrite(cls, text) {
  // 打字机：同类续写同一个元素（每个字新建 div 会炸 DOM），换类先关门
  let last = log.lastChild;
  if (last && last.dataset.tw === cls && !last.dataset.done) {
    last.textContent += text;
  } else {
    if (last && last.dataset.tw && !last.dataset.done) last.dataset.done = "1";
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.dataset.tw = cls;
    d.textContent = text;
    log.appendChild(d);
  }
  log.scrollTop = log.scrollHeight;
}

function closeTypewriter(fallbackText) {
  // final 兜底：本轮没打过字（如预算耗尽的打捞文本）才整段显示，防与打字机重复
  const last = log.lastChild;
  if (last && last.dataset.tw && !last.dataset.done) {
    last.dataset.done = "1";
  } else {
    add("assistant", fallbackText);
  }
}

async function send() {
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  add("user", "> " + text);
  status.textContent = "思考中…";
  const resp = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text }),
  });
  const reader = resp.body.getReader();   // EventSource 只支持 GET，POST 得手动读流
  const dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split("\n\n");     // SSE 报文以空行分隔
    buf = parts.pop();                   // 最后一段可能只有半条，留到下一轮再拼
    for (const p of parts) {
      if (!p.startsWith("data: ")) continue;
      const ev = JSON.parse(p.slice(6));
      if (ev.kind === "final") closeTypewriter(ev.text);
      else if (ev.kind === "think") typewrite("think", ev.text);
      else if (ev.kind === "answer") typewrite("answer", ev.text);
      else if (ev.kind === "done") status.textContent = "空闲";
      else if (ev.kind === "error") { add("error", "⚠️ " + ev.text); status.textContent = "空闲"; }
      else add(ev.kind, ev.text);        // round / tool_call / tool_result / warn 各自配色
    }
  }
  status.textContent = "空闲";           // 流断/收尾统一归位，防卡"思考中"
}
q.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

async function resetChat() {
  const r = await fetch("/reset", { method: "POST" });
  const d = await r.json();
  if (d.ok) log.innerHTML = "";            // 服务器历史已清，界面同步清空
  else add("error", "⚠️ " + d.msg);
}
</script>
</body>
</html>
